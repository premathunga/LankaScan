name: Build LankaScan Pro
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with: {name: LankaScan-Pro-APK, path: '**/build/outputs/apk/debug/*.apk', if-no-files-found: error}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: build-log, path: build.log}

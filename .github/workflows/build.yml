name: Build LankaScan Offline Minimal
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build Debug
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "=== ERRORS ==="; grep -n "e: file" build.log | head -100
      - uses: actions/upload-artifact@v4
        with: {name: APK, path: app/build/outputs/apk/debug/*.apk}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: build-log, path: build.log}

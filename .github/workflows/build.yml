name: Build LankaScan Pro Complete
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build APK
        run: |
          if [ -f "settings.gradle.kts" ]; then gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log;
          elif [ -f "LankaScan/settings.gradle.kts" ]; then cd LankaScan && gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log; cd ..;
          else echo "NO PROJECT"; ls -R; exit 1; fi
          find . -name "*.apk" -type f
      - uses: actions/upload-artifact@v4
        with: {name: LankaScan-Pro-APK, path: "**/build/outputs/apk/debug/*.apk", if-no-files-found: error}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: build-log, path: build.log}
